{% extends "base.html" %}
{% block title %}Podium — {{ season.season_name }}{% endblock %}
{% block content %}
<div class="podium-controls" style="margin-bottom: 1.5rem; display: flex; gap: 0.75rem; justify-content: center;">
  <a href="{{ url_for('standings.index', season_id=season.season_id) }}" class="btn btn-secondary btn-sm">← Standings</a>
  <a href="{{ url_for('standings.podium', season_id=season.season_id, share='1') }}"
     class="btn btn-primary btn-sm" target="_blank">Open Share View</a>
  <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">Print / Save PDF</button>
</div>

{% include "standings/_podium_body.html" %}
{% endblock %}
