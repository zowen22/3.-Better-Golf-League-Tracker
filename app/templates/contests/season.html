{% extends "base.html" %}
{% block title %}Contests — {{ season['season_name'] }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🏅 Contests</h1>
  <span class="page-subtitle">{{ season['season_name'] }}</span>
  {% if session['role'] == 'league_admin' %}
  <a href="{{ url_for('contests.admin_list', season_id=season['season_id']) }}" class="btn btn-secondary btn-sm" style="margin-left:auto">⚙ Manage Contests</a>
  {% endif %}
</div>

{% include 'contests/_results_body.html' %}
{% endblock %}
