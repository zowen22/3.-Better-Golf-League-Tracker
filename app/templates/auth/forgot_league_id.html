{% extends 'base.html' %}
{% block title %}Forgot League ID — Golf League Tracker{% endblock %}
{% block content %}
<div class="form-page form-page--centered">
  <h1>Forgot Your League ID?</h1>
  <p class="form-subtitle">Enter the admin email on file for your league, and we'll send you the League ID.</p>

  <form method="POST" action="{{ url_for('auth.forgot_league_id') }}" class="card-form">
    <div class="form-group">
      <label for="admin_email">Administrator Email Address</label>
      <input type="email" id="admin_email" name="admin_email" placeholder="you@example.com" required autofocus>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Submit</button>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
